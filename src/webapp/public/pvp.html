<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Pokémon Battle Arena</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="pvp.css" />
</head>
<body>
  <div id="app">
    <div id="screen-loading" class="screen active">
      <div class="spinner"></div>
      <p>Connecting to the battle...</p>
    </div>

    <div id="screen-error" class="screen">
      <div class="error-icon">⚠️</div>
      <p id="error-text">Something went wrong.</p>
    </div>

    <div id="screen-battle" class="screen">
      <div class="arena">
        <div class="combatant boss-side">
          <div class="name-row">
            <span class="name" id="opp-name"></span>
            <span class="type-badges" id="opp-types"></span>
          </div>
          <div class="bench-row" id="opp-bench"></div>
          <div class="sprite-wrap">
            <img id="opp-sprite" class="sprite boss-sprite" alt="" />
            <div class="hit-flash" id="opp-hit-flash"></div>
            <div class="swap-toast" id="opp-swap-toast"></div>
          </div>
          <div class="hp-bar">
            <div class="hp-fill boss-hp-fill" id="opp-hp-fill"></div>
          </div>
          <div class="hp-text" id="opp-hp-text">-- / --</div>
        </div>

        <div class="vs" id="turn-indicator">VS</div>

        <div class="combatant player-side">
          <div class="name-row">
            <span class="name" id="you-name"></span>
            <span class="type-badges" id="you-types"></span>
          </div>
          <div class="bench-row" id="you-bench"></div>
          <div class="sprite-wrap">
            <img id="you-sprite" class="sprite mon-sprite" alt="" />
            <div class="hit-flash" id="you-hit-flash"></div>
            <div class="swap-toast" id="you-swap-toast"></div>
          </div>
          <div class="hp-bar">
            <div class="hp-fill mon-hp-fill" id="you-hp-fill"></div>
          </div>
          <div class="hp-text" id="you-hp-text">-- / --</div>
        </div>
      </div>

      <div class="damage-popup" id="damage-popup"></div>

      <div class="move-grid" id="move-grid"></div>
      <p class="turn-status" id="turn-status"></p>

      <div class="battle-log" id="battle-log"></div>
    </div>

    <div id="screen-ended" class="screen">
      <div class="big-icon" id="ended-icon">🏁</div>
      <h2 id="ended-title">Battle Ended</h2>
      <p id="ended-sub"></p>
      <button id="close-btn" class="attack-btn">Close</button>
    </div>
  </div>
  <script src="pvp.js"></script>
</body>
</html>
